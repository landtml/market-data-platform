<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="market-data-platform logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0b1426"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0ea5a4"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- three stacked partitions -->
  <polygon points="128,150 204,128 128,106 52,128" fill="url(#l3)"/>
  <polygon points="52,128 128,150 128,166 52,144" fill="#3730a3"/>
  <polygon points="204,128 128,150 128,166 204,144" fill="#4338ca"/>
  <polygon points="128,122 204,100 128,78 52,100" fill="url(#l2)"/>
  <polygon points="52,100 128,122 128,138 52,116" fill="#0369a1"/>
  <polygon points="204,100 128,122 128,138 204,116" fill="#0284c7"/>
  <polygon points="128,94 204,72 128,50 52,72" fill="url(#l1)"/>
  <polygon points="52,72 128,94 128,110 52,88" fill="#0f766e"/>
  <polygon points="204,72 128,94 128,110 204,88" fill="#0d9488"/>
  <!-- verification mark -->
  <circle cx="190" cy="190" r="30" fill="#0b1426" stroke="#2dd4bf" stroke-width="5"/>
  <path d="M175 190 l11 11 l21 -23" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

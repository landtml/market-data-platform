    <text x="620" y="474"><tspan font-weight="700">154,690</tspan><tspan fill="#94a3b8"> parquet files</tspan></text>
    <text x="930" y="474"><tspan font-weight="700">55 GB</tspan><tspan fill="#94a3b8"> not included</tspan></text>

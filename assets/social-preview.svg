  <text x="330" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#f1f5f9">market-data-platform</text>
  <text x="332" y="352" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">Point-in-time crypto futures data, and the evidence</text>

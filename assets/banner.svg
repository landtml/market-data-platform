    <polygon points="52,100 128,122 128,138 52,116" fill="#0369a1"/>
    <polygon points="204,100 128,122 128,138 204,116" fill="#0284c7"/>
    <polygon points="128,94 204,72 128,50 52,72" fill="url(#l1)"/>

    <polygon points="204,72 128,94 128,110 204,88" fill="#0d9488"/>
    <circle cx="190" cy="190" r="30" fill="#0b1426" stroke="#2dd4bf" stroke-width="5"/>
    <path d="M175 190 l11 11 l21 -23" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="290" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">market-data-platform</text>
  <text x="292" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#94a3b8">Point-in-time crypto futures data, with a manifest you can verify</text>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(292,204)">
      <rect width="190" height="54" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#2dd4bf" stroke-opacity="0.5"/>
      <text x="16" y="25" font-size="22" font-weight="700" fill="#2dd4bf">2.16 billion</text><text x="16" y="44" font-size="13" fill="#94a3b8">rows</text>
    </g>
    <g transform="translate(498,204)">
      <rect width="190" height="54" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="16" y="25" font-size="22" font-weight="700" fill="#38bdf8">154,690</text><text x="16" y="44" font-size="13" fill="#94a3b8">parquet files, 55 GB</text>
    </g>
    <g transform="translate(704,204)">
      <rect width="190" height="54" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="16" y="25" font-size="22" font-weight="700" fill="#818cf8">5 checks</text><text x="16" y="44" font-size="13" fill="#94a3b8">verify offline in &lt;1 s</text>
